name: Container security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Render manifests
        run: |
          kubectl kustomize k8s >/dev/null
          kubectl kustomize k8s-openshift >/dev/null
      - name: Build and smoke test
        run: make smoke
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mohankrishna999/prometheus:3.15.1-patched
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml
          exit-code: '1'
      - name: Grype scan
        uses: anchore/scan-action@v7
        with:
          image: mohankrishna999/prometheus:3.15.1-patched
          fail-build: true
          severity-cutoff: negligible
